<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virtual DOM Example - React</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <h2>React (Deklaratif + Virtual DOM)</h2>
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [items, setItems] = React.useState(['A', 'B', 'C']);
      const [counter, setCounter] = React.useState(0);

      // log setiap kali komponen render
      React.useEffect(() => {
        console.log('🔄 Render React: jumlah item =', items.length);
      });

      const addItem = () => {
        setCounter(counter + 1);
        setItems([...items, `Item ${counter + 1}`]);
      };

      return (
        <div>
          <ul>
            {items.map((item) => (
              <li key={item}>{item}</li>
            ))}
          </ul>
          <button onClick={addItem}>Tambah Item</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
