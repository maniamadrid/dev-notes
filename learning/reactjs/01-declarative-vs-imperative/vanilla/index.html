<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Imperative Example - Vanilla JS</title>
</head>
<body>
  <div id="app"></div>

  <script>
    // Buat tombol
    const button = document.createElement('button');
    button.textContent = 'Klik saya';

    // Tambahkan ke DOM
    document.getElementById('app').appendChild(button);

    // Tambahkan event listener
    button.addEventListener('click', () => {
      button.textContent = 'Sudah diklik';
    });
  </script>
</body>
</html>
